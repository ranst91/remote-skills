<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A small chat that discovers and reads a remote skill." />
    <title>Remote Skills Chat</title>
  </head>
  <body>
    <main class="shell">
      <header class="intro">
        <p class="eyebrow">Remote Skills · Python</p>
        <h1>Ask with context.</h1>
        <p class="lede">This agent discovers a locally published skill before it answers.</p>
      </header>

      <section class="chat" aria-label="Chat with the skill-enabled agent">
        <div id="conversation" class="conversation" role="log" aria-live="polite">
          <p id="empty-state" class="empty-state">
            Begin with a greeting and watch the agent retrieve the relevant skill.
          </p>
        </div>
        <div id="alert" class="alert" role="alert" hidden></div>

        <form id="chat-form" class="composer">
          <label for="message">Your message</label>
          <textarea id="message" rows="2" placeholder="Say hello…" required></textarea>
          <div class="actions">
            <button id="sample" class="quiet" type="button">Try “Hello!”</button>
            <div class="primary-actions">
              <button id="reset" class="quiet" type="button">Reset</button>
              <button id="send" class="send" type="submit">Send</button>
            </div>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
