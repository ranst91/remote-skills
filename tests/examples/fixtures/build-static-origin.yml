name: Validate Pages origin

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-origin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@remote-skills/cli...' build
      - run: pnpm --dir examples/publisher build
      - name: Verify the origin-root layout locally
        run: node tests/examples/helpers/verify-origin.ts examples/publisher/dist
