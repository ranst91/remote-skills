name: release / publish

on:
  push:
    branches: [main]
    paths: [release-state.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke-test without publishing
        type: boolean
        default: true
      release_sha:
        description: Full main-branch release commit SHA (required when publishing)
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  context:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Resolve and validate the immutable release commit
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          sha=${REQUESTED_SHA:-$GITHUB_SHA}
          if [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN" != true ] && [ -z "$REQUESTED_SHA" ]; then
            echo 'A full release_sha is required for publication.' >&2; exit 1
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$sha" "$GITHUB_SHA"
          if [ "$DRY_RUN" != true ]; then
            git worktree add --detach "$RUNNER_TEMP/release-validation" "$sha"
            (cd "$RUNNER_TEMP/release-validation" && node "$GITHUB_WORKSPACE/scripts/release/release.ts" validate "$sha")
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  validate:
    needs: context
    uses: ./.github/workflows/ci.yml
    with:
      release_ref: ${{ needs.context.outputs.sha }}
  publish:
    needs: [context, validate]
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate.outputs.artifact_name }}
          path: release-dist/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.33"
          enable-cache: false
      - name: Read the selected verified publication plan
        id: plan
        run: node release-dist/publish-artifacts.ts metadata release-dist
      - name: Publish missing npm versions with trusted publishing
        run: node release-dist/publish-artifacts.ts npm release-dist
      - name: Generate Python publish attestations
        if: steps.plan.outputs.has_python == 'true'
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
        with:
          paths: release-dist/python/*
      - name: Publish missing Python artifacts with trusted publishing
        if: steps.plan.outputs.has_python == 'true'
        run: node release-dist/publish-artifacts.ts python release-dist
      - name: Verify exact registry versions and artifact digests
        run: node release-dist/publish-artifacts.ts verify release-dist
      - name: Create scoped GitHub releases at the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.context.outputs.sha }}
        run: node release-dist/publish-artifacts.ts release release-dist
